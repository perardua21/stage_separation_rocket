[platformio]
default_envs = bench

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 32MB
; The populated module is ESP32-S3-DevKitC-1-N32R16V:
; 32 MB octal flash + 16 MB octal PSRAM.  qio_opi generates a quad-flash
; bootloader, which the ROM rejects with "For OPI Flash, Use Default Flash
; Boot Mode" and then resets.
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi
board_build.partitions = large_littlefs_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
build_unflags = -std=gnu++11
lib_deps =
  ; BNO08x is vendored under lib/ so its SHTP write loop has a bounded retry.
  adafruit/Adafruit BMP3XX Library@^2.1.6
build_flags =
  -std=gnu++17
  -D BOARD_HAS_PSRAM
  -D NURA_BNO_RESET_INVERTED=1
  -D CORE_DEBUG_LEVEL=1
  -I include
build_src_filter =
  +<*>
  -<diagnostics/>

[env:bench]
build_flags =
  ${env.build_flags}
  -D NURA_BENCH_SAFE=1

; One-shot PCB soldering/peripheral bring-up image. This does not start the
; flight state machine and never enables any heater output.
[env:pcb_bringup]
build_flags =
  ${env.build_flags}
  -D NURA_BENCH_SAFE=1
  -D NURA_PCB_BRINGUP=1
build_src_filter =
  -<*>
  +<diagnostics/pcb_bringup_main.cpp>
  +<hal/bno085_hal.cpp>
  +<hal/bmp388_hal.cpp>
  +<hal/battery_voltage_hal.cpp>

; Completely isolated BNO085 SPI test. It compiles only the standalone test
; file and does not link the project HAL, FreeRTOS missions, or flight logic.
[env:bno085_test]
lib_deps =
  adafruit/Adafruit BusIO@^1.17.4
  adafruit/Adafruit Unified Sensor@^1.1.15
build_flags =
  ${env.build_flags}
  -D NURA_BNO085_STANDALONE=1
build_src_filter =
  -<*>
  +<diagnostics/bno085_standalone_main.cpp>
