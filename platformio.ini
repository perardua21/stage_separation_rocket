; stage_separation_rocket — ESP32-S3 + ESP-IDF(FreeRTOS)
; 보드: TUSI Economic Final PCB, 모듈 ESP32-S3-DevKitC-1-N32R16V

[platformio]
default_envs = flight
src_dir = src
include_dir = include
test_dir = test

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; N32R16V = 32MB Quad Flash + 16MB Octal PSRAM
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_build.psram_type = opi

build_flags =
    -I include
    -I src/bsp
    -I src/flight
    -I src/common
    -D BOARD_HAS_PSRAM

[env:flight]
build_flags =
    ${env.build_flags}
    -D NURA_BUILD_FLIGHT=1
    -D LOG_LEVEL=2

; 벤치 빌드: 열선 출력을 컴파일 단계에서 끊는다. 비행에 쓰지 말 것.
[env:bench]
build_flags =
    ${env.build_flags}
    -D NURA_BUILD_BENCH=1
    -D NURA_DISABLE_HEATER_OUTPUT=1
    -D LOG_LEVEL=4

[env:native]
platform = native
test_framework = unity
build_flags = -I include -I src/flight -I src/common -D NURA_HOST_TEST=1
