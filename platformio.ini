; NURA 2단 로켓 펌웨어
;
; 역할(1단/2단)은 빌드 타임에 고정된다. J7 엇갈림 배선 때문에 핀으로
; 단 구분이 불가능하다. 역할을 지정하지 않으면 컴파일되지 않는다.
;
;   비행 보드 (ESP32-S3, 열선 차단)
;     pio run -e bench_s1  -t upload -t monitor     1단
;     pio run -e bench_s2  -t upload -t monitor     2단
;
;   비행 보드 (열선 실제 구동) — 아래 "비행 빌드 전 확인" 참조
;     pio run -e flight_s1 -t upload
;     pio run -e flight_s2 -t upload
;
;   지상국 (빵판 ESP32 + E22)
;     pio run -e ground -t upload -t monitor
;
;   호스트 단위 테스트
;     pio test -e native
;
; default_envs 는 native 다. 그냥 pio run 하면 플래싱 가능한 이미지가
; 아예 만들어지지 않는다. 업로드할 때는 반드시 역할을 직접 써야 한다.
; "1단 보드에 2단 펌웨어" 사고를 막기 위한 장치다.
;
; 플래싱 전 확인
;   1) PCB 에 적힌 1단/2단 표시
;   2) 부팅 배너의 ROLE 줄
;   3) 부팅 부저 — 1단은 길게 한 번, 2단은 짧게 두 번
;
; 비행 빌드 전 확인
;   1) 점화기 저항 측정 (전자팀 D 항목: 아직 미측정 → 점화기 연결 금지)
;   2) 화약 빼고 열선 저항만 달아 CH1/CH2 발사 시험
;   3) ARM 없이 CH 만 켰을 때 HEAT_POWER 에 전압이 안 걸리는지 확인
;   4) 발사 시 배터리 레일 강하 로깅 확인 (Apogee 구간 100 Hz 샘플링)

[platformio]
default_envs = native

[env]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I include

; ─────────────────────────────────────────────────────────────
; 비행 보드 공통 (ESP32-S3-DevKitC-1-N32R16V)
; ─────────────────────────────────────────────────────────────
[s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
monitor_filters = esp32_exception_decoder
board_build.flash_size = 32MB
; The populated module is ESP32-S3-DevKitC-1-N32R16V:
; 32 MB octal flash + 16 MB octal PSRAM.  qio_opi generates a quad-flash
; bootloader, which the ROM rejects with "For OPI Flash, Use Default Flash
; Boot Mode" and then resets.
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi
board_build.partitions = large_littlefs_32MB.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
lib_deps =
  ; BNO08x is vendored under lib/ so its SHTP write loop has a bounded retry.
  adafruit/Adafruit BMP3XX Library@^2.1.6
build_flags =
  ${env.build_flags}
  -D BOARD_HAS_PSRAM
  -D NURA_BNO_RESET_INVERTED=1
  -D CORE_DEBUG_LEVEL=1

; 벤치 이미지는 비행용 출력 클래스를 아예 컴파일하지 않는다. 이미지 안에
; 열선을 켤 수 있는 코드가 한 줄도 들어가지 않는다. 비행 이미지는 반대로
; 벤치용(전부 차단) 클래스를 빼서, 실수로 차단된 쪽이 링크되지 않게 한다.
;
; extends 는 한 단계만 쓴다. PlatformIO 버전에 따라 extends 연쇄가 동작하지
; 않는 경우가 있어, 각 환경이 [s3] 를 직접 가리키게 했다.

[env:bench_s1]
extends = s3
build_flags = ${s3.build_flags} -D NURA_BENCH_SAFE=1 -D NURA_ROLE_BOOSTER=1
build_src_filter =
  +<*>
  -<diagnostics/>
  -<hal/flight_actuator_output.cpp>

[env:bench_s2]
extends = s3
build_flags = ${s3.build_flags} -D NURA_BENCH_SAFE=1 -D NURA_ROLE_SUSTAINER=1
build_src_filter =
  +<*>
  -<diagnostics/>
  -<hal/flight_actuator_output.cpp>

[env:flight_s1]
extends = s3
build_flags =
  ${s3.build_flags}
  -D NURA_FLIGHT_OUTPUTS_VALIDATED=1
  -D NURA_ROLE_BOOSTER=1
build_src_filter =
  +<*>
  -<diagnostics/>
  -<hal/bench_actuator_output.cpp>

[env:flight_s2]
extends = s3
build_flags =
  ${s3.build_flags}
  -D NURA_FLIGHT_OUTPUTS_VALIDATED=1
  -D NURA_ROLE_SUSTAINER=1
build_src_filter =
  +<*>
  -<diagnostics/>
  -<hal/bench_actuator_output.cpp>

; ─────────────────────────────────────────────────────────────
; 지상국. 빵판 ESP32 + E22 만. 센서도 SD 도 화약도 없다.
; 보드가 ESP32-S3 라면 board 를 esp32-s3-devkitc-1 로 바꾼다.
; 핀 배선은 src/diagnostics/ground_station_main.cpp 위쪽 상수에서 고친다.
; ─────────────────────────────────────────────────────────────
[env:ground]
platform = espressif32@^6.9.0
board = esp32dev
monitor_filters = esp32_exception_decoder
build_flags = ${env.build_flags}
build_src_filter =
  -<*>
  +<diagnostics/ground_station_main.cpp>
  +<core/telemetry_protocol.cpp>
  +<core/flight_state_machine.cpp>

; ─────────────────────────────────────────────────────────────
; 호스트 단위 테스트. 상태머신과 무선 프로토콜을 PC 에서 돌린다.
; ─────────────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = custom
test_build_src = yes
build_src_filter =
  -<*>
  +<core/flight_state_machine.cpp>
  +<core/telemetry_protocol.cpp>
build_flags =
  -std=gnu++17
  -I include
  -I src

; ─────────────────────────────────────────────────────────────
; 진단용 이미지
; ─────────────────────────────────────────────────────────────
; One-shot PCB soldering/peripheral bring-up image. This does not start the
; flight state machine and never enables any heater output.
[env:pcb_bringup]
extends = s3
build_flags =
  ${s3.build_flags}
  -D NURA_BENCH_SAFE=1
  -D NURA_PCB_BRINGUP=1
build_src_filter =
  -<*>
  +<diagnostics/pcb_bringup_main.cpp>
  +<hal/bno085_hal.cpp>
  +<hal/bmp388_hal.cpp>
  +<hal/battery_voltage_hal.cpp>

; Completely isolated BNO085 SPI test. It compiles only the standalone test
; file and does not link the project HAL, FreeRTOS missions, or flight logic.
[env:bno085_test]
extends = s3
lib_deps =
  adafruit/Adafruit BusIO@^1.17.4
  adafruit/Adafruit Unified Sensor@^1.1.15
build_flags =
  ${s3.build_flags}
  -D NURA_BNO085_STANDALONE=1
build_src_filter =
  -<*>
  +<diagnostics/bno085_standalone_main.cpp>

; Standalone stationary axis inclination check. No flight application.
[env:bno085_axis_tilt]
extends = s3
lib_deps =
  adafruit/Adafruit BusIO@^1.17.4
  adafruit/Adafruit Unified Sensor@^1.1.15
build_flags = ${s3.build_flags} -D NURA_AXIS_TILT_DIAG=1
build_src_filter =
  -<*>
  +<diagnostics/bno085_axis_tilt_main.cpp>
  +<hal/bno085_hal.cpp>
